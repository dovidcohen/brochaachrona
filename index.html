  <script>
    // Auto-redirect iOS/Android visitors to the right store; everyone else sees both buttons.
    (function () {
      var IOS_URL = 'https://apps.apple.com/app/id6827544143';
      var PLAY_URL = 'https://play.google.com/store/apps/details?id=com.dovidcohen.brochaachrona';
      var ua = navigator.userAgent || '';
      var iOS = /iPad|iPhone|iPod/.test(ua) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS
      var android = /Android/i.test(ua);
      if (iOS) window.location.replace(IOS_URL);
      else if (android) window.location.replace(PLAY_URL);
    })();
  </script>
  <style>

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    }

    h1 { font-size: 1.7rem; margin-bottom: .1rem; }
    .he { font-size: 1.3rem; margin: 0 0 .5rem; }

    a.btn { display: block; margin: 1rem auto; padding: .95rem 1.25rem;

    a.btn.android { background: #5c3b0c; }
    footer { margin-top: 3rem; font-size: .8rem; color: #8a7f70; }

  </style>
